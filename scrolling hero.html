    <style>
      :root {
	--font-size-min: 14;
	--font-size-max: 20;
	--font-ratio-min: 1.1;
	--font-ratio-max: 1.33;
	--font-width-min: 375;
	--font-width-max: 1500;

	--start: 0;
	--end: 360;
	--lightness: 65%;
	--base-chroma: 0.3;
}







.fluid {
	--fluid-min: calc(
		var(--font-size-min) * pow(var(--font-ratio-min), var(--font-level, 0))
	);
	--fluid-max: calc(
		var(--font-size-max) * pow(var(--font-ratio-max), var(--font-level, 0))
	);
	--fluid-preferred: calc(
		(var(--fluid-max) - var(--fluid-min)) /
			(var(--font-width-max) - var(--font-width-min))
	);

	font-size: clamp(
		(var(--fluid-min) / 16) * 1rem,
		((var(--fluid-min) / 16) * 1rem) -
			(((var(--fluid-preferred) * var(--font-width-min)) / 16) * 1rem) +
			(var(--fluid-preferred) * 100vi),
		(var(--fluid-max) / 16) * 1rem
	);
}



.word-scroll {
	--font-level: 5;
	width: 100%;
}

.word-scroll-inner {
	display: flex;
	justify-content: center;
	line-height: 1.3;
}

.word-scroll-inner h2 {
	position: sticky;
	top: calc(50vh - 0.5lh);
	margin: 0;
	font-size: inherit;
	font-weight: 500;
	height: fit-content;
}

.word-scroll-inner ul {
	list-style: none;
	margin: 0;
	padding-left: 0;
	--step: calc((var(--end) - var(--start)) / (var(--count) - 1));
}



.word-scroll li:not(:last-of-type) {
	color: #ababab;
    font-weight: 500 ;
}

.word-scroll h2,
.word-scroll li:last-of-type {
	background: #fff;
	background-clip: text;
	color: #0000;

    font-weight: 500 ;
}










    </style>

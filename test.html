<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Image</title>

<style>
body {
  font: 42px "Source Sans Pro", "Helvetica Neue", Arial, Helvetica, sans-serif;
  background-color: #fff;
  color: #000;
  text-align: center;
  padding: 0;
  margin: 0;
}

.header {
  opacity: 0;
  transform: translateY(50px);
  transition: all 1.2s ease-out;
}

.headerVisible {
  opacity: 1;
  transform: translateY(0);
}

.section {
  padding: 200px;
}

.section-blue {
  background-color: #1267fb;
  color: #fff;
}

.section-black {
  background-color: #000;
  color: #fff;
}



</style>

</head>

<body>
  
  <!-- from http://tobiasahlin.com
 -->
<html>
<head>
  <title>Text with delay</title>
  <meta charset="utf-8">
</head>
<body>
  <div class="section section-white">
    <h1 class="header">Hello 👋</h1>
  </div>

  <div class="section section-blue">
    <h1 class="header">Text on this page...</h1>
  </div>

  <div class="section section-black">
    <h1 class="header">will only appear...</h1>
  </div>

  <div class="section section-white">
    <h1 class="header">when it becomes...</h1>
  </div>

  <div class="section section-blue">
    <h1 class="header">visible in the viewport...</h1>
  </div>

  <div class="section section-black">
    <h1 class="header">nifty, right?</h1>
  </div>
</body>
</html>



<script>function checkForVisibility() {
  var headers = document.querySelectorAll(".header");
  headers.forEach(function(header) {
    if (isElementInViewport(header)) {
      header.classList.add("headerVisible");
    } else {
      header.classList.remove("headerVisible");
    }
  });
}

function isElementInViewport(el) {
  var rect = el.getBoundingClientRect();

  return (
    rect.top >= 0 &&
    rect.left >= 0 &&
    rect.bottom <=
      (window.innerHeight || document.documentElement.clientHeight) &&
    rect.right <= (window.innerWidth || document.documentElement.clientWidth)
  );
}

if (window.addEventListener) {
  addEventListener("DOMContentLoaded", checkForVisibility, false);
  addEventListener("load", checkForVisibility, false);
  addEventListener("scroll", checkForVisibility, false);
}


</script>



</body>
</html>

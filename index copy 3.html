<!DOCTYPE html>
<html lang="zxx">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- bootstrap grid css -->
    <link rel="stylesheet" href="css/plugins/bootstrap-grid.css">
    <!-- swiper css -->
    <link rel="stylesheet" href="css/plugins/swiper.min.css">
    <!-- fancybox css -->
    <link rel="stylesheet" href="css/plugins/fancybox.min.css">
    <!-- ashley scss -->
    <link rel="stylesheet" href="css/style.css">
      <link rel="icon" type="image/gif" href="/img/ezgif.com-gif-maker.gif">
    <!-- page name -->

    
    <title>Portfolio | Leo Denega
    </title>


    <style>
    

    .image-playground {
  position: relative;
  width: 100%;
  height: 500px;
  overflow: hidden;
}

.floating-image {
  position: absolute;
  width: 180px;
  height: 220px;
  object-fit: cover;

  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);

  will-change: transform;
}

    </style>


    


</head>



<body style="overflow-x: hidden;">

  

    <div class="image-playground">
      <img src="img/drawings/argentina.png" class="floating-image">
      <img src="img/drawings/belgium.png" class="floating-image">
      <img src="img/drawings/luxembourg.png" class="floating-image">
      <img src="img/drawings/morocco.png" class="floating-image">
    </div>

    

    

<script>
const playground = document.querySelector('.image-playground');
const images = document.querySelectorAll('.floating-image');

images.forEach((image, index) => {
  // Random starting position
  const x = Math.random() * 70 + 10;
  const y = Math.random() * 60 + 10;
  const rotation = Math.random() * 20 - 10;

  image.style.left = `${x}%`;
  image.style.top = `${y}%`;
  image.style.transform = `rotate(${rotation}deg)`;

  image.dataset.rotation = rotation;
});

playground.addEventListener('mousemove', (e) => {
  const rect = playground.getBoundingClientRect();

  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  images.forEach((image) => {
    const imageRect = image.getBoundingClientRect();

    const imageCenterX =
      imageRect.left - rect.left + imageRect.width / 2;

    const imageCenterY =
      imageRect.top - rect.top + imageRect.height / 2;

    const distanceX = mouseX - imageCenterX;
    const distanceY = mouseY - imageCenterY;

    const distance = Math.sqrt(
      distanceX * distanceX +
      distanceY * distanceY
    );

    // Only affect images close to the cursor
    const radius = 300;

    if (distance < radius) {
      const strength = (1 - distance / radius) * 25;

      const moveX = (distanceX / distance) * strength;
      const moveY = (distanceY / distance) * strength;

      image.style.transform = `
        translate(${moveX}px, ${moveY}px)
        rotate(${image.dataset.rotation}deg)
      `;
    } else {
      image.style.transform = `
        translate(0, 0)
        rotate(${image.dataset.rotation}deg)
      `;
    }
  });
});

playground.addEventListener('mouseleave', () => {
  images.forEach((image) => {
    image.style.transform = `
      translate(0, 0)
      rotate(${image.dataset.rotation}deg)
    `;
  });
});
</script>


   

 
</body>


</html>
